name: Deploy Web Preview

on:
  push:
    branches:
      - cursor/loudhouse-mobile-app-5a4e
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: loudhouse-app/package-lock.json

      - name: Install dependencies
        working-directory: loudhouse-app
        run: npm ci

      - name: Build web app
        working-directory: loudhouse-app
        run: npx expo export --platform web

      - name: Add SPA fallback
        working-directory: loudhouse-app/dist
        run: cp index.html 404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./loudhouse-app/dist
          cname: false
