name: Deploy Web Preview

on:
  push:
    branches:
      - cursor/loudhouse-mobile-app-5a4e
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: loudhouse-app/package-lock.json

      - name: Install dependencies
        working-directory: loudhouse-app
        run: npm ci

      - name: Build web app
        working-directory: loudhouse-app
        run: npx expo export --platform web

      - name: Add SPA fallback
        working-directory: loudhouse-app/dist
        run: cp index.html 404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: loudhouse-app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
